name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/brasa_viva
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate

      - name: Ejecutar pruebas
        run: npm test

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site
          cp frontend/index.html _site/index.html
          cp frontend/admin.html _site/admin.html
          cp -R frontend/src _site/src

      - name: Aplicar URL personalizada de la API
        env:
          BRASA_API_URL: ${{ vars.BRASA_API_URL }}
        run: |
          if [ -n "$BRASA_API_URL" ]; then
            python -c 'import json, os; open("_site/src/assets/js/config.js", "w", encoding="utf-8").write("window.BRASA_API_URL = " + json.dumps(os.environ["BRASA_API_URL"].rstrip("/")) + ";\n")'
          fi

      - name: Cargar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
